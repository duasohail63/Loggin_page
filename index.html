<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="navbar">
                <a href="#" class="menucontent"><i class="fal fa-bars"></i></a>
            </div>
        </header>
        <section class="register">
            <div class="row">
                <div class="box">
                    <h1>Register</h1>
                    <h2>Select the profile that fits you</h2>
                    <div class="wrapper">
                        <div class="one">
                            <div class="colone">
                                <img src="../Building.png" alt="">
                            </div>
                            <p>Business</p>
                        </div>
                        <div class="two">
                            <div class="coltwo">
                                <img src="../Freelancer (2).png" alt="">
                            </div>
                            <p>Freelancer</p>
                        </div>
                        <div class="three">
                            <div class="colthree">
                                <img src="../Persona (1).png" alt="">
                            </div>
                            <p>Private user</p>
                        </div>
                    </div>
                    <div class="text">
                        <label for="options"><b>I am from:</b>
                            <select id="options" name="options">
                                <option value=" disabled selected ">Select</option>
                                <option value="option1">Punjab</option>
                                <option value="option2">KPK</option>
                                <option value="option3">GB</option>
                                <option value="option4">Sindh</option>
                                <option value="option5">Balochistan</option>
                            </select></label>
                        <a href="#">Continue</a>
                    </div>
                    <div class="boxbottom">
                        <div class="bottom">
                            <p>Already have account? <a href="#">Login</a></p>
                        </div>
                    </div>
                </div>

            </div>
    </div>

    </section>
</body>
<div class="footone">
    <div class="foot">
        <div class="blueimage">
            <img src="../White.png" alt="">
        </div>
        <p>Privacy Policy | Terms of Use | Cookies Policy</p>
    </div>
</div>
<div class="foottwo">
    <div class="foot">
        <p>Copyright © WorkConnect 2022. All Rights Reserved.</p>
    </div>
</div>

</html>
